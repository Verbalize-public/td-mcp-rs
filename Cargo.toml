[workspace]
resolver = "2"
members = [
    "crates/tdmcp-core",
    "crates/tdmcp-config",
    "crates/tdmcp-diagnostics",
    "crates/tdmcp-ipc",
    "crates/tdmcp-mcp",
    "crates/tdmcp-projectio",
    "crates/tdmcp-dialogs",
    "crates/tdmcp-daemon",
    "crates/tdmcp-gui",
    "crates/tdmcp-test-support",
    "xtask",
]
default-members = [
    "crates/tdmcp-core",
    "crates/tdmcp-config",
    "crates/tdmcp-diagnostics",
    "crates/tdmcp-ipc",
    "crates/tdmcp-mcp",
    "crates/tdmcp-projectio",
    "crates/tdmcp-daemon",
    "crates/tdmcp-test-support",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/Verbalize-public/td-mcp-rs"

[workspace.dependencies]
tdmcp-core = { path = "crates/tdmcp-core" }
tdmcp-config = { path = "crates/tdmcp-config" }
tdmcp-diagnostics = { path = "crates/tdmcp-diagnostics" }
tdmcp-ipc = { path = "crates/tdmcp-ipc" }
tdmcp-mcp = { path = "crates/tdmcp-mcp" }
tdmcp-projectio = { path = "crates/tdmcp-projectio" }
tdmcp-dialogs = { path = "crates/tdmcp-dialogs" }
tdmcp-test-support = { path = "crates/tdmcp-test-support" }

anyhow = "1"
async-trait = "0.1"
auto-launch = "0.6"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6"
toml_edit = { version = "0.22", features = ["serde"] }
include_dir = "0.7"
minijinja = "2"
eframe = { version = "0.35", default-features = true }
egui = "0.35"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
    "client",
    "transport-streamable-http-client-reqwest",
    "transport-io",
    "transport-async-rw",
] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
serde_yaml = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
tokio-util = "0.7"
tower = "0.5"
tracing = "0.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
# "registry": workspace pins features (defaults off) and layered subscribers need it.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
tray-icon = "0.24"
# Linux tray uses appindicator3 (libayatana-appindicator-glib) via GTK.
# This is the maintained Ayatana fork of libappindicator; more reliable
# than the older libayatana-appindicator crate (L-10).
appindicator3 = { version = "0.3", features = ["v0_5"] }
winit = "0.30"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
# deny (not forbid): exactly one quarantined unsafe module exists —
# tdmcp-ipc::winsec (Windows pipe security descriptor FFI). Constitution
# amendment 2026-08-23; RISKS.md R8.
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"

[profile.release]
# Distribution binaries ship stripped (cargo-native, applies to MSVC + macOS).
strip = true
