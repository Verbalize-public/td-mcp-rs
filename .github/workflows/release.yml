name: Release

# Tag-driven: pushing tag v{version} (= [workspace.package] version) builds
# every target through the same `cargo run -p xtask -- package` used locally,
# smoke-tests each archive, aggregates checksums, and publishes the release.
#
# Failure playbook:
# - "tag vX but Cargo.toml says Y" -> fix mismatched side, delete tag, retag.
# - lockfile drift                 -> commit updated Cargo.lock first.
# - missing ISCC (windows)         -> fallback `choco install innosetup -y --no-progress`.
# - mac link errors                -> see docs/DELIVERY.md packaging section.

on:
  push:
    tags: ["v*"]
  # Rehearse the entire native packaging pipeline without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version and validate release tags
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml says ${CARGO_VERSION} — fix one side, delete the tag, retag"
            exit 1
          fi
          echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "packaging ${CARGO_VERSION}"

  checks:
    needs: assert
    uses: ./.github/workflows/ci.yml
    with:
      dependencies: true

  build:
    needs: [assert, checks]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      # Floor for egui/winit; keep in sync with LSMinimumSystemVersion in
      # packaging/macos/Info.plist.template.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Native platform tests
        if: runner.os != 'Linux'
        run: cargo test --locked --workspace
      - name: Package binaries
        run: cargo run --locked -p xtask -- package --target ${{ matrix.target }} --out dist

      # --- macOS: .app bundle + DMG; signs/notarizes when secrets exist ---
      - name: Build app bundle + DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/make_app.sh \
            "target/${{ matrix.target }}/release/tdmcp-daemon" \
            "${{ needs.assert.outputs.version }}" "${{ matrix.target }}" dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke test archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          tar -xzf dist/tdmcp-rs-*-${{ matrix.target }}.tar.gz -C staging
          python3 scripts/package_smoke.py --distribution staging/tdmcp-daemon

      # --- Windows: one extraction feeds the smoke test and the installer ---
      - name: Stage installer payload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path dist/tdmcp-rs-*.zip -DestinationPath staging -Force
          python scripts/package_smoke.py --distribution staging/tdmcp-daemon.exe
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DVersion=${{ needs.assert.outputs.version }}" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Aggregate SHA256SUMS across platforms
        working-directory: dist
        run: |
          sha256sum tdmcp-rs-*.zip tdmcp-rs-*.tar.gz tdmcp-rs-*.dmg tdmcp-rs-*-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Attestations are public-repo-only on this plan; auto-enable when the
      # repo goes public. Private repos rely on the SHA256SUMS above.
      - name: Attest build provenance
        if: github.repository_visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/**
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes
