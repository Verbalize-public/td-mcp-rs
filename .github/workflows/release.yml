name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: Release action
        type: choice
        options: [draft, build-only, publish]
        default: draft
      commit:
        description: Exact commit SHA (must match the selected workflow ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  assert:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      mode: ${{ steps.version.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin commit and validate version tag
        id: version
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          RELEASE_MODE: ${{ inputs.mode || 'publish' }}
        run: python3 scripts/release.py prepare

  checks:
    needs: assert
    uses: ./.github/workflows/ci.yml
    with:
      source_only: true
      dependencies: false
      native: false

  build:
    needs: [assert, checks]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      # Floor for egui/winit; keep in sync with LSMinimumSystemVersion in
      # packaging/macos/Info.plist.template.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assert.outputs.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92.0'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Platform dependency gate
        run: cargo deny --locked --target ${{ matrix.target }} check 2>&1 | tee dependencies.log
        shell: bash
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Native platform tests
        run: cargo test --locked --workspace 2>&1 | tee rust-tests.log
        shell: bash
      - name: Package binaries
        run: cargo run --locked -p xtask -- package --target ${{ matrix.target }} --out dist 2>&1 | tee package.log
        shell: bash

      # --- macOS: .app bundle + DMG; signs/notarizes when secrets exist ---
      - name: Build app bundle + DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/make_app.sh \
            "target/${{ matrix.target }}/release/tdmcp-daemon" \
            "${{ needs.assert.outputs.version }}" "${{ matrix.target }}" dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke test archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          tar -xzf dist/tdmcp-rs-*-${{ matrix.target }}.tar.gz -C staging
          python3 scripts/package_smoke.py --distribution staging/tdmcp-daemon

      # --- Windows: one extraction feeds the smoke test and the installer ---
      - name: Stage installer payload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path dist/tdmcp-rs-*.zip -DestinationPath staging -Force
          python scripts/package_smoke.py --distribution staging/tdmcp-daemon.exe
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DVersion=${{ needs.assert.outputs.version }}" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record qualified files
        env:
          RELEASE_SHA: ${{ needs.assert.outputs.sha }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/release.py qualify
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*-setup.exe
            dist/qualified-*.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            *.log
            dist/
            staging/
          retention-days: 90
          if-no-files-found: ignore

  publish:
    needs: [assert, checks, build]
    if: ${{ !cancelled() && needs.assert.result == 'success' && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assert.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publish qualified platforms and report failures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.assert.outputs.sha }}
          RELEASE_VERSION: ${{ needs.assert.outputs.version }}
          RELEASE_MODE: ${{ needs.assert.outputs.mode }}
        run: python3 scripts/release.py publish
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/**
