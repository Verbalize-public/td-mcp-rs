name: Checks

on:
  workflow_dispatch:
    inputs:
      native:
        description: Also test Windows and macOS
        type: boolean
        default: false
      dependencies:
        description: Also check release dependency licenses and advisories
        type: boolean
        default: false
  workflow_call:
    inputs:
      native:
        type: boolean
        default: false
      dependencies:
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    needs: dependencies
    if: ${{ !cancelled() && github.event_name != 'schedule' && (needs.dependencies.result == 'success' || needs.dependencies.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: taiki-e/install-action@v2
        with:
          tool: actionlint@1.7.12
      - run: actionlint
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s scripts/tests
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python -m pip install pytest
      - run: python -m pytest bridge/tests -q

  native:
    needs: dependencies
    if: ${{ !cancelled() && inputs.native && (needs.dependencies.result == 'success' || needs.dependencies.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  dependencies:
    if: github.event_name == 'schedule' || inputs.dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: python3 scripts/check_dependencies.py
