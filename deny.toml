# Run `python scripts/check_dependencies.py` for all release targets separately.
# A combined target graph admits impossible paths such as our Windows/macOS
# tray-icon dependency's Linux-only GTK backend.

[graph]
all-features = true

[licenses]
version = 2
# OpenSSL covers aws-lc-rs (rustls' default provider) assembly bits.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
