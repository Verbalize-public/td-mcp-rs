<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Signal Line Gradient -->
    <linearGradient id="cyanToPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <!-- Node Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Core Spark Intense Glow Filter -->
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- External Compact Network Inputs / Output (Drawn within tight margins) -->
  <g stroke="url(#cyanToPurple)" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <!-- Top-Left Input Connector -->
    <path d="M 64 160 L 112 192" stroke-dasharray="8 6" />
    <circle cx="64" cy="160" r="9" fill="#00F2FE" stroke="#121620" stroke-width="3" />

    <!-- Bottom-Left Input Connector -->
    <path d="M 64 352 L 112 320" stroke-dasharray="8 6" />
    <circle cx="64" cy="352" r="9" fill="#00F2FE" stroke="#121620" stroke-width="3" />

    <!-- Right Output Connector -->
    <path d="M 400 256 L 448 256" stroke-dasharray="8 6" />
    <circle cx="448" cy="256" r="9" fill="#9D4EDD" stroke="#121620" stroke-width="3" />
  </g>

  <!-- Main Node Operator Frame (Expanded for central prominence) -->
  <rect x="112" y="112" width="288" height="288" rx="48" 
        fill="#121620" stroke="url(#cyanToPurple)" stroke-width="7" 
        filter="url(#glow)" />

  <!-- Internal Converging Wire Paths -->
  <path d="M 112 192 Q 200 192 256 256" stroke="#00F2FE" stroke-width="6" fill="none" opacity="0.9" />
  <path d="M 112 320 Q 200 320 256 256" stroke="#00F2FE" stroke-width="6" fill="none" opacity="0.9" />
  <path d="M 400 256 L 256 256" stroke="#9D4EDD" stroke-width="6" fill="none" opacity="0.9" />

  <!-- Node Connection Ports on Main Frame -->
  <circle cx="112" cy="192" r="9" fill="#00F2FE" />
  <circle cx="112" cy="320" r="9" fill="#00F2FE" />
  <circle cx="400" cy="256" r="9" fill="#9D4EDD" />

  <!-- Central Intelligence Core Spark (Scaled up) -->
  <g filter="url(#intenseGlow)">
    <!-- Central Core Node -->
    <circle cx="256" cy="256" r="22" fill="#FFFFFF" />
    
    <!-- AI Spark Overlay -->
    <path d="M 256 192 Q 256 256 192 256 Q 256 256 256 320 Q 256 256 320 256 Q 256 256 256 192 Z" 
          fill="#00F2FE" />
    <path d="M 256 212 Q 256 256 212 256 Q 256 256 256 300 Q 256 256 300 256 Q 256 256 256 212 Z" 
          fill="#FFFFFF" />
  </g>
</svg>
