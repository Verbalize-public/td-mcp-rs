[package]
name = "tdmcp-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "td-mcp-rs tray dashboard (egui) — lib consumed by tdmcp-daemon under the `gui` feature"

[lib]
name = "tdmcp_gui"
path = "src/lib.rs"

[features]
## Dev-only fixture harness for pixel-verifying dashboard states without a
## real TouchDesigner (`cargo run -p tdmcp-gui --features preview --example
## dashboard_preview`). Never enabled by the daemon build.
preview = []

[[example]]
name = "dashboard_preview"
required-features = ["preview"]

[dependencies]
anyhow = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
image = { workspace = true }
notify-rust = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tdmcp-config = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
winit = { workspace = true }

# tray-icon drives the native status item everywhere but Linux: its Linux
# backend needs GTK + libappindicator (crashed the daemon when absent, L-10).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { workspace = true }

# Linux tray = appindicator3 (libayatana-appindicator-glib) via GTK.
[target.'cfg(target_os = "linux")'.dependencies]
appindicator3 = { workspace = true }

[lints]
workspace = true
