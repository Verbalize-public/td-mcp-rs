[package]
name = "tdmcp-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "td-mcp-rs daemon binary (composition root)"

[[bin]]
name = "tdmcp-daemon"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:tdmcp-gui"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
auto-launch = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
include_dir = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tdmcp-config = { workspace = true }
tdmcp-core = { workspace = true }
tdmcp-diagnostics = { workspace = true }
tdmcp-ipc = { workspace = true }
tdmcp-mcp = { workspace = true }
tdmcp-gui = { path = "../tdmcp-gui", optional = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
tdmcp-test-support = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
