# td-mcp-rs configuration
#
# Location (default):
#   Windows: %APPDATA%\tdmcp-rs\config.toml
#   macOS:   ~/Library/Application Support/tdmcp-rs/config.toml
#   Linux:   $XDG_CONFIG_HOME/tdmcp-rs/config.toml  (or ~/.config/…)
#
# Edit with the tray dashboard gear icon, or by hand.
# Changes apply after the next daemon restart.
# `tdmcp-daemon install --force` resets this file to the shipped defaults.

[server]
# HTTP listen port for MCP + admin (default: 9860).
port = 9860

# Listen IP. Default 127.0.0.1 (loopback only). Use 0.0.0.0 for remote;
# non-loopback requires [auth] mode = "psk" with a non-empty psk.
bind_address = "127.0.0.1"

[auth]
# Incoming request auth: "none" (default) or "psk" (Bearer token required).
mode = "none"

# Shared secret for Authorization: Bearer <psk> when mode = "psk".
psk = ""


[federation]
# Role: "standalone" (default), "master" (accept slaves), or "slave" (register + push).
role = "standalone"

# Persistent UUID for this daemon; auto-generated on first start — do not hand-edit.
daemon_id = ""

# When role = "slave": master base URL (http://host:port).
master_url = ""

# When role = "slave": Bearer token matching the master's auth.psk.
master_psk = ""

[daemon]
# When true, the daemon never auto-exits after idle (no MCP sessions and no TD bridges).
# Default false: idle exit after ~30s (override timeout with TDMCP_IDLE_EXIT_SECS).
keep_alive = false

# When true, register the daemon to start at user login (OS autostart).
# Default false. Applied once at daemon start.
always_on = false

# When true, show the system-tray dashboard (requires a gui-enabled build).
# Default true. CLI --no-gui / TDMCP_NO_GUI=1 still forces headless.
show_tray = true

[bridge]
# Seconds to wait for ping / inspect / capture responses (default: 45).
call_timeout_secs = 45

# Seconds to wait for execute_python / mutate_nodes (default: 120).
script_timeout_secs = 120

# Seconds between idle bridge ping probes (default: 5).
heartbeat_interval_secs = 5

# Seconds to wait for a heartbeat pong before treating the peer as dead (default: 8).
pong_timeout_secs = 8

# Seconds of inbound silence before tearing down a bridge session (default: 20).
# Also forwarded to the Python bridge via handshake idleDeadSecs.
idle_dead_secs = 20

[advanced]
# Optional overrides. Leave unset to use built-in defaults under the data dir.
# `daemon_bin` is set automatically by `tdmcp-daemon install` and is the
# stable path used for spawn / restart / autostart.
# data_dir = "C:/path/to/tdmcp-rs-data"
# bridge_dir = "C:/path/to/bridge"
# catalog_path = "C:/path/to/diagnostics/catalog.yaml"
# daemon_bin = "C:/path/to/tdmcp-daemon.exe"
