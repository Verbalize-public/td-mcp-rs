# Diagnostic catalog for td-mcp-rs
# Every code emitted by daemon/bridge must appear here.

entries:
  - code: tdmcp.bridge.unknown_pid
    layer: fleet
    message: "Unknown or dead pid — process not listed or never connected"
    mitigation:
      - "Re-fleet; pid exited or never connected"
    references:
      - kind: doc
        id: fleet

  - code: tdmcp.bridge.lost
    layer: fleet
    message: "Bridge IPC link lost for this pid"
    mitigation:
      - "Re-fleet; check cancelledTasks"
      - "Wait for same-pid resurrection or re-handshake"
    references:
      - kind: doc
        id: resurrection

  - code: tdmcp.bridge.queue_busy
    layer: fleet
    message: "Exclusive request rejected — queue is non-empty"
    mitigation:
      - "Re-fleet with include: tasks"
      - "Backoff or wait until queue is empty"
    references:
      - kind: doc
        id: task_queue

  - code: tdmcp.bridge.timeout
    layer: fleet
    message: "Daemon wait timed out — TD may still be running"
    mitigation:
      - "Re-fleet to check liveness"
      - "Do not assume the TD-side work was cancelled"
    references:
      - kind: doc
        id: timeouts

  - code: tdmcp.bridge.version
    layer: fleet
    message: "Bridge package version incompatible with daemon"
    mitigation:
      - "Upgrade daemon or bridge package so minDaemon is satisfied"
    references:
      - kind: doc
        id: bridge_package

  - code: tdmcp.op.not_found
    layer: mutate
    message: "Could not resolve OpPath"
    mitigation:
      - "Re-inspect the zone with include: nodes"
      - "Fix contextPath or use lint suggestions"
      - "Do not replay the whole batch — fix from failedAt only"
    references:
      - kind: doc
        id: op_path_harness

  - code: tdmcp.op.similar_name
    layer: mutate
    message: "Similar node name found nearby"
    mitigation:
      - "Consider the suggested canonical path if it matches intent"
    references:
      - kind: doc
        id: op_path_harness

  - code: tdmcp.op.outside_zone
    layer: mutate
    message: "Path is outside the authorized mutation zone"
    mitigation:
      - "Use an authorized subtree or widen the mutation zone"
    references:
      - kind: doc
        id: mutation_zones

  - code: tdmcp.batch.skipped_dependent
    layer: mutate
    message: "Later batch step skipped because a prior step failed"
    mitigation:
      - "Fix the failedAt step only"
      - "Do not replay successful create steps"
    references:
      - kind: doc
        id: mutate_nodes

  - code: tdmcp.par.unknown
    layer: mutate
    message: "Unknown parameter on node"
    mitigation:
      - "Query api_help for the OP family"
    references:
      - kind: doc
        id: api_help

  - code: tdmcp.script.execution_failed
    layer: script
    message: "Python script execution failed"
    mitigation:
      - "Fix using span + references"
      - "Prefer mutate_nodes for simple create/set/delete"
    references:
      - kind: corpus
        id: corpora/td-software/distilled/python-td-module/README.md

  - code: tdmcp.td.glsl_compile
    layer: structure
    message: "GLSL compile / cook error reported by TouchDesigner"
    mitigation:
      - "Pulse Reinit on the GLSL TOP/MAT"
      - "Re-inspect the node errors"
    references:
      - kind: corpus
        id: corpora/td-software

  - code: tdmcp.perception.black_frame
    layer: perception
    message: "Captured TOP frame is black — perception fail"
    mitigation:
      - "Re-inspect wiring and zone face"
      - "Re-capture; perception-critic FAIL until fixed"
    references:
      - kind: doc
        id: capture

  - code: tdmcp.perception.no_path
    layer: perception
    message: "No perception path for this COMP (opviewer / out1 / TOP child missing)"
    mitigation:
      - "Wire zone out1 / opviewer"
      - "Then capture mode: preview"
    references:
      - kind: doc
        id: capture
