# Diagnostic catalog for td-mcp-rs
# Every code emitted by daemon/bridge must appear here.
# kind:doc id must match skills/MANIFEST.yaml (uri = tdmcp://docs/<id>).
# kind:tool id must be a shipped MCP tool name.
# kind:api_help may omit query (spliced at runtime for unknown type/par).

entries:
  - code: tdmcp.bridge.unknown_pid
    layer: fleet
    message: "Unknown or dead pid — process not listed or never connected"
    mitigation:
      - "Call fleet; pick a connected pid (exited or never connected)"
    references:
      - kind: tool
        id: fleet

  - code: tdmcp.bridge.lost
    layer: fleet
    message: "Bridge IPC link lost for this pid"
    mitigation:
      - "Call fleet; check cancelledTasks on that pid"
      - "Wait for same-pid resurrection or re-handshake, then retry"
    references:
      - kind: tool
        id: fleet
      - kind: doc
        id: play-state
        uri: tdmcp://docs/play-state

  - code: tdmcp.bridge.cancelled
    layer: fleet
    message: "Queued or in-flight bridge work was cancelled"
    mitigation:
      - "Call fleet; check cancelledTasks"
      - "Retry after the bridge is Connected again"
    references:
      - kind: tool
        id: fleet
      - kind: doc
        id: play-state
        uri: tdmcp://docs/play-state

  - code: tdmcp.bridge.main_thread_timeout
    layer: fleet
    message: "Bridge gave up waiting for TD main thread (paused timeline or hung script)"
    mitigation:
      - "Ensure the timeline is playing; paused TD stalls main-thread work"
      - "Call fleet to confirm Connected, then retry"
      - "`resources/read` `tdmcp://docs/play-state`"
    references:
      - kind: doc
        id: play-state
        uri: tdmcp://docs/play-state
      - kind: tool
        id: fleet

  - code: tdmcp.bridge.queue_busy
    layer: fleet
    message: "Bridge pid queue is busy — call tools sequentially"
    mitigation:
      - "Call bridged tools one at a time against this pid"
      - "Call fleet with include: [\"tasks\"] to see in-flight work"
      - "Do not disconnect or restart — wait for the queue to drain, then retry"
      - "`resources/read` `tdmcp://docs/tooling-concurrency`"
    references:
      - kind: doc
        id: tooling-concurrency
        uri: tdmcp://docs/tooling-concurrency
      - kind: tool
        id: fleet

  - code: tdmcp.mcp.session_busy
    layer: fleet
    message: "Session already has an in-flight bridged call against this pid"
    mitigation:
      - "Wait for the in-flight tool on this session+pid to finish"
      - "Call bridged tools sequentially (no parallel inspect/execute_python/capture/mutate)"
      - "fleet and describe_tools remain available while a call is in flight"
      - "`resources/read` `tdmcp://docs/tooling-concurrency`"
    references:
      - kind: doc
        id: tooling-concurrency
        uri: tdmcp://docs/tooling-concurrency

  - code: tdmcp.bridge.timeout
    layer: fleet
    message: "Daemon wait timed out — TD may still be running"
    mitigation:
      - "Call fleet to check liveness"
      - "Do not assume the TD-side work was cancelled (timeout ≠ cancel)"
      - "`resources/read` `tdmcp://docs/play-state`"
    references:
      - kind: doc
        id: play-state
        uri: tdmcp://docs/play-state
      - kind: tool
        id: fleet

  - code: tdmcp.bridge.version
    layer: fleet
    message: "Bridge package version incompatible with daemon"
    mitigation:
      - "Reserved in v1; not emitted. Upgrade daemon or bridge so minDaemon matches when a future compat gate lands"
    references:
      - kind: tool
        id: fleet

  - code: tdmcp.daemon.unreachable
    layer: fleet
    message: "Stdio proxy lost its HTTP link to the daemon"
    mitigation:
      - "If downtime is short, wait and retry (daemon may be mid-restart)"
      - "Verify with inspect before retrying a mutation whose effect is unknown"
      - "If downtime exceeds ~15s, run `tdmcp-daemon ensure` or restart the MCP client (stdio proxy never auto-spawns)"
    references:
      - kind: tool
        id: fleet

  - code: tdmcp.remote.unauthorized
    layer: fleet
    message: "Auth token missing or wrong on a protected path"
    mitigation:
      - "Send Authorization: Bearer <psk> matching the daemon auth.psk"
      - "Confirm auth.mode = \"psk\" and the PSK is non-empty when binding non-loopback"
    references:
      - kind: tool
        id: fleet


  - code: tdmcp.federation.auth_rejected
    layer: fleet
    message: "Slave registration rejected by master (PSK mismatch)"
    mitigation:
      - "Confirm federation.master_psk matches the master's auth.psk"
      - "Send Authorization: Bearer <master_psk> on register / fleet-push"
    references:
      - kind: tool
        id: fleet

  - code: tdmcp.federation.slave_unreachable
    layer: fleet
    message: "Master cannot reach a slave for a proxied tool call"
    mitigation:
      - "Check slave daemon is running and network-reachable"
      - "Confirm the slave re-registers / fleet-pushes after reconnect"
    references:
      - kind: tool
        id: fleet

  - code: tdmcp.federation.ambiguous_pid
    layer: fleet
    message: "Pid matches multiple daemons; include daemonId to disambiguate"
    mitigation:
      - "Pass daemonId from fleet alongside pid"
      - "Inspect fleet candidates listed in the diagnostic payload"
    references:
      - kind: tool
        id: fleet

  - code: tdmcp.op.not_found
    layer: mutate
    message: "Could not resolve OpPath for a mutate step"
    mitigation:
      - "Call inspect on the zone with include: [\"nodes\"]"
      - "Fix contextPath or use lint suggestions"
      - "Fix the failedAt step only; later steps are skipped, not replayed"
    references:
      - kind: tool
        id: inspect
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.op.similar_name
    layer: mutate
    message: "Similar node name found nearby"
    mitigation:
      - "Consider the suggested canonical path if it matches intent"
    references:
      - kind: tool
        id: inspect

  - code: tdmcp.op.renamed
    layer: mutate
    message: "Create used a different path than requested (TD auto-rename)"
    mitigation:
      - "Trust the echoed step path / suggestion.opPath — not the requested leaf"
      - "Later steps in the same mutate_nodes batch that reuse the requested path are remapped to the created op"
      - "To target the pre-existing occupant instead, inspect and use its path, or split batches"
    references:
      - kind: tool
        id: mutate_nodes
      - kind: tool
        id: inspect

  - code: tdmcp.op.outside_zone
    layer: mutate
    message: "Path is outside the authorized mutation zone"
    mitigation:
      - "Reserved for future per-pid zone enforcement (P2). v1 daemon is zone-agnostic"
      - "`resources/read` `tdmcp://docs/mutation-zones`"
    references:
      - kind: doc
        id: mutation-zones
        uri: tdmcp://docs/mutation-zones

  - code: tdmcp.op.children_truncated
    layer: structure
    message: "Inspect direct-child roster capped"
    mitigation:
      - "Inspect a child COMP path for nested overview"
      - "detailLevel does not raise this cap"
      - "Use execute_python only if you need the full name list"
    references:
      - kind: tool
        id: inspect

  - code: tdmcp.op.paths_truncated
    layer: structure
    message: "Inspect paths batch capped"
    mitigation:
      - "Split into multiple inspect calls (soft cap 96 paths)"
      - "Keep batches small for responsive inspect"
    references:
      - kind: tool
        id: inspect

  - code: tdmcp.op.paths_required
    layer: structure
    message: "Inspect requires a non-empty paths array"
    mitigation:
      - "Pass paths: [\"/project1/...\"] with at least one OpPath"
    references:
      - kind: tool
        id: inspect

  - code: tdmcp.op.inspect_failed
    layer: structure
    message: "Per-path inspect shaping failed after resolve"
    mitigation:
      - "Re-inspect that single path"
      - "Check diagnostics at diagnosticLevel: detailed if needed"
    references:
      - kind: tool
        id: inspect

  - code: tdmcp.editor.context_failed
    layer: editor
    message: "editor_context handler failed unexpectedly"
    mitigation:
      - "Re-call editor_context"
      - "Confirm TD UI is available (not mid-load)"
    references:
      - kind: tool
        id: editor_context

  - code: tdmcp.editor.pane_failed
    layer: editor
    message: "Per-pane editor_context shaping failed"
    mitigation:
      - "Ignore that pane entry and use siblings"
      - "Re-call editor_context after focusing a network editor"
    references:
      - kind: tool
        id: editor_context

  - code: tdmcp.editor.selection_truncated
    layer: editor
    message: "editor_context per-pane selection capped"
    mitigation:
      - "Narrow selection in TD"
      - "Call inspect on the owner COMP for full roster (soft cap 96)"
    references:
      - kind: tool
        id: editor_context
      - kind: tool
        id: inspect

  - code: tdmcp.editor.panes_truncated
    layer: editor
    message: "editor_context panes array capped"
    mitigation:
      - "Close unused panes in TD (soft cap 32)"
    references:
      - kind: tool
        id: editor_context

  - code: tdmcp.batch.skipped_dependent
    layer: mutate
    message: "Later mutate step skipped because a prior step failed"
    mitigation:
      - "Fix the failedAt step only"
      - "Do not replay successful create steps"
    references:
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.par.unknown
    layer: mutate
    message: "Unknown parameter on node"
    mitigation:
      - "Call inspect with include: [\"params\"] for live .par names (api_help does not list parameters)"
      - "Use suggestion.replace when a similar_name lint is present"
      - "values is for .par.*; flags is for OP attributes (display, viewer, bypass, …)"
    references:
      - kind: api_help
      - kind: tool
        id: inspect

  - code: tdmcp.api_help.not_found
    layer: structure
    message: "api_help query target not found or unsupported"
    mitigation:
      - "Class names are case-sensitive (e.g. noiseTOP, not noise)"
      - "Use kind: classes with family/prefix to explore op-like names"
      - "module queries support only name 'td' in v1"
    references:
      - kind: tool
        id: api_help

  - code: tdmcp.api_help.queries_required
    layer: structure
    message: "api_help requires a non-empty queries array"
    mitigation:
      - "Pass queries: [{kind: class, name: …}] or classes/module entries"
    references:
      - kind: tool
        id: api_help

  - code: tdmcp.api_help.queries_truncated
    layer: structure
    message: "api_help queries batch exceeded the soft cap"
    mitigation:
      - "Split into multiple api_help calls"
      - "Prefer classes with family/prefix filters"
    references:
      - kind: tool
        id: api_help

  - code: tdmcp.api_help.classes_truncated
    layer: structure
    message: "api_help classes index exceeded the soft name cap"
    mitigation:
      - "Narrow with family and/or prefix filters"
    references:
      - kind: tool
        id: api_help

  - code: tdmcp.flag.unknown
    layer: mutate
    message: "Unknown operator flag name (not in the operate-relevant Common Flags subset)"
    mitigation:
      - "Allowed flags: activeViewer, allowCooking, bypass, cloneImmune, display, lock, render, viewer"
      - "values is for .par.*; flags is for direct OP attributes"
      - "Fix the failedAt step only; later steps are skipped, not replayed"
    references:
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.par.wrong_collection
    layer: mutate
    message: "Name is an OP flag, not a .par — use flags"
    mitigation:
      - "Move the name into the step's flags object"
      - "Do not put Common Flags (display, viewer, bypass, …) under values/expressions/pulse"
    references:
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.flag.wrong_collection
    layer: mutate
    message: "Name is a .par parameter, not an OP flag — use values"
    mitigation:
      - "Move the name into the step's values (or expressions/pulse) object"
      - "flags only accepts the operate-relevant Common Flags allowlist"
    references:
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.par.similar_name
    layer: mutate
    message: "Similar parameter name found on the node"
    mitigation:
      - "Retry with the suggested .par name from the lint suggestion.replace"
      - "Call inspect with include: [\"params\"] if unsure"
    references:
      - kind: tool
        id: inspect
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.par.enable_expr_failed
    layer: structure
    message: "Custom parameter enableExpr failed to evaluate"
    mitigation:
      - "Fix custom parameter enableExpr (Component Editor)"
      - "Re-inspect after correcting the expression"
      - "`resources/read` `tdmcp://docs/custom-parameters`"
    references:
      - kind: doc
        id: custom-parameters
        uri: tdmcp://docs/custom-parameters
      - kind: tool
        id: inspect

  - code: tdmcp.op.similar_type
    layer: mutate
    message: "Similar opType found (case or near-miss)"
    mitigation:
      - "Retry create with the suggested opType from the lint suggestion.replace"
      - "TD op class names are case-sensitive (e.g. hsvadjustTOP, not hsvAdjustTOP)"
    references:
      - kind: tool
        id: mutate_nodes
      - kind: tool
        id: api_help

  - code: tdmcp.op.unknown_type
    layer: mutate
    message: "Unknown or unresolved opType for create"
    mitigation:
      - "Fix the opType string (e.g. noiseTOP, not noise) — names are case-sensitive"
      - "Call api_help with queries: [{kind: class, name: …}] or kind: classes + family/prefix"
      - "Fix the failedAt step only; later steps are skipped, not replayed"
    references:
      - kind: api_help
      - kind: tool
        id: api_help
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.mutate.step_failed
    layer: mutate
    message: "Mutate step failed with a TD-side exception"
    mitigation:
      - "Read the message / rawTraceback for the TD error"
      - "Fix the failedAt step only; later steps are skipped, not replayed"
      - "Common causes: locked node, duplicate name, wrong parent family"
    references:
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.mutate.not_dat
    layer: mutate
    message: "Text write targeted a non-DAT operator"
    mitigation:
      - "Inspect the target: only DAT-family ops accept `text` (textDAT, tableDAT, …)"
      - "Write shader bodies to the stage DAT referenced by the GLSL op's stage par"
      - "Fix the failedAt step only; later steps are skipped, not replayed"
    references:
      - kind: tool
        id: mutate_nodes
      - kind: tool
        id: inspect

  - code: tdmcp.wire.bad_index
    layer: mutate
    message: "Connector index out of range for connect/disconnect"
    mitigation:
      - "Use srcOutput/dstInput/input within the OP's connector count (usually 0)"
      - "Re-inspect the node; multi-in/out OPs expose more indices"
      - "Fix the failedAt step only; later steps are skipped, not replayed"
    references:
      - kind: tool
        id: inspect
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.wire.connect_failed
    layer: mutate
    message: "Connector connect/disconnect raised a TD-side error"
    mitigation:
      - "Confirm both ops exist and share a compatible family for wiring"
      - "Read the message for the TD connector error"
      - "Fix the failedAt step only; later steps are skipped, not replayed"
      - "`resources/read` `tdmcp://docs/network-design`"
    references:
      - kind: doc
        id: network-design
        uri: tdmcp://docs/network-design
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.shader.compiled
    layer: mutate
    message: "Shader consumer compiled successfully (note)"
    mitigation:
      - "Informational only — no action needed; never flips tool ok"
      - "Reading compileResult forces a synchronous recompile of the consumer"
    references:
      - kind: tool
        id: mutate_nodes
      - kind: tool
        id: inspect

  - code: tdmcp.shader.compile_failed
    layer: mutate
    message: "Shader consumer compile failed"
    mitigation:
      - "Read item lines[] — verbatim ERROR: lines carry the DAT path + line number"
      - "Fix the stage DAT body (line numbers include any preamble you wrote)"
      - "Re-write via mutate_nodes text and re-check shaderDiagnostics"
    references:
      - kind: tool
        id: mutate_nodes
      - kind: tool
        id: inspect

  - code: tdmcp.shader.unsupported_consumer
    layer: mutate
    message: "Consumer exposes no compile-status surface"
    mitigation:
      - "glslPOP has no verified compileResult in this TD build — status unknown"
      - "Check OP.errors() / an Info DAT for that consumer instead"
    references:
      - kind: tool
        id: inspect

  - code: tdmcp.shader.consumers_truncated
    layer: mutate
    message: "Shader consumer scan or diagnostics capped"
    mitigation:
      - "Narrow contextPath to the relevant subtree and retry"
      - "Inspect specific GLSL nodes directly for full detail"
    references:
      - kind: tool
        id: inspect

  - code: tdmcp.script.execution_failed
    layer: script
    message: "Python script execution failed"
    mitigation:
      - "Fix using span + exception.frames (user script frames only)"
      - "Prefer mutate_nodes for simple create/set/delete/connect/disconnect"
      - "`resources/read` `tdmcp://docs/python-api`"
    references:
      - kind: doc
        id: python-api
        uri: tdmcp://docs/python-api
      - kind: tool
        id: execute_python

  - code: tdmcp.script.none_op
    layer: script
    message: "Attribute access on None — likely a missing op() / bad path"
    mitigation:
      - "Confirm the operator path exists via inspect before reading attributes"
      - "op() returns None when the path is missing — check spelling and parent COMP"
      - "`resources/read` `tdmcp://docs/python-api`"
    references:
      - kind: doc
        id: python-api
        uri: tdmcp://docs/python-api
      - kind: tool
        id: inspect

  - code: tdmcp.script.too_large
    layer: script
    message: "execute_python script exceeds the bridge size cap"
    mitigation:
      - "Split the script into smaller execute_python calls"
      - "Prefer mutate_nodes for create/wire/set/delete batches"
      - "Keep custom-page / bulk setup scripts under 1 MiB UTF-8"
    references:
      - kind: tool
        id: execute_python
      - kind: tool
        id: mutate_nodes

  - code: tdmcp.script.result_too_large
    layer: script
    message: "execute_python result JSON exceeds the bridge size cap — truncated, not discarded (the script already ran)"
    mitigation:
      - "Return a smaller result (paths/ids/summaries, not full dumps)"
      - "Prefer inspect / mutate_nodes for structural reads"
      - "Persist large data on the node graph and return a reference instead"
    references:
      - kind: tool
        id: execute_python
      - kind: tool
        id: inspect

  - code: tdmcp.td.glsl_compile
    layer: structure
    message: "GLSL compile / cook error reported by TouchDesigner"
    mitigation:
      - "Pulse Reinit on the GLSL TOP/MAT"
      - "Re-inspect the node errors"
      - "`resources/read` `tdmcp://docs/glsl`"
    references:
      - kind: doc
        id: glsl
        uri: tdmcp://docs/glsl
      - kind: doc
        id: td-glsl-ground-truth
        uri: tdmcp://docs/td-glsl-ground-truth

  - code: tdmcp.perception.black_frame
    layer: perception
    message: "Captured TOP frame is black — perception fail"
    mitigation:
      - "Re-inspect wiring and zone face"
      - "Re-capture; look claim stays FAIL until fixed"
      - "If the TOP should have content, cook it — op('…').cook(force=True) via execute_python"
      - "`resources/read` `tdmcp://docs/look-grade`"
    references:
      - kind: doc
        id: look-grade
        uri: tdmcp://docs/look-grade
      - kind: doc
        id: play-state
        uri: tdmcp://docs/play-state
      - kind: tool
        id: capture

  - code: tdmcp.perception.uniform_frame
    layer: perception
    message: "Captured TOP frame is a uniform solid color — perception fail"
    mitigation:
      - "Re-inspect wiring and zone face"
      - "Re-capture; look claim stays FAIL until fixed"
      - "SOP/MAT/DAT viewer capture reflects TD's default viewport framing; use a Render TOP chain for a true look claim"
      - "`resources/read` `tdmcp://docs/look-grade`"
    references:
      - kind: doc
        id: look-grade
        uri: tdmcp://docs/look-grade
      - kind: tool
        id: capture

  - code: tdmcp.perception.no_path
    layer: perception
    message: "No perception path (shared capture_viewer missing or bind failed)"
    mitigation:
      - "Ensure the tdmcp_rs bridge COMP is loaded and Connected"
      - "Re-run ensure so ./capture_viewer exists"
      - "Then capture mode: preview (or auto)"
    references:
      - kind: tool
        id: capture
      - kind: tool
        id: fleet

  - code: tdmcp.perception.wrong_family
    layer: perception
    message: "Capture mode does not match the resolved operator family"
    mitigation:
      - "Use mode chop_data on a CHOP, top on a TOP, preview (or auto) for any other family"
      - "Re-inspect the path family, then re-capture with the matching mode"
      - "`resources/read` `tdmcp://docs/operator-families`"
    references:
      - kind: doc
        id: operator-families
        uri: tdmcp://docs/operator-families
      - kind: tool
        id: capture

  - code: tdmcp.perception.empty_chop
    layer: perception
    message: "CHOP has no channels or samples to capture"
    mitigation:
      - "Wire or cook a non-empty CHOP before capture"
      - "Re-inspect numChans / numSamples, then re-capture mode: chop_data"
    references:
      - kind: tool
        id: capture
      - kind: tool
        id: inspect

  - code: tdmcp.perception.chop_truncated
    layer: perception
    message: "CHOP capture capped (channels, samples, or total scalars)"
    mitigation:
      - "Narrow the CHOP window or channel count in TD before re-capture"
      - "Caps are fixed: 32 channels, 256 samples/channel, 4096 scalars"
    references:
      - kind: tool
        id: capture

  - code: tdmcp.perception.max_size_too_large
    layer: perception
    message: "capture maxSize (or native resolution) exceeds the hard cap"
    mitigation:
      - "Pass an explicit maxSize at or below the cap (1536px longer side)"
      - "null (native resolution) is only honored when native is already under the cap"
    references:
      - kind: tool
        id: capture

  - code: tdmcp.perception.converter_failed
    layer: perception
    message: "Shared OP Viewer / legacy converter capture path failed"
    mitigation:
      - "Prefer mode preview (or auto) — chop_image/pop are aliases of preview"
      - "Confirm the tdmcp_rs bridge has ./capture_viewer (OP Viewer TOP)"
      - "Re-capture; shared viewer is persistent — no temp residue expected"
    references:
      - kind: tool
        id: capture
      - kind: doc
        id: look-grade
        uri: tdmcp://docs/look-grade

  - code: tdmcp.args.missing_field
    layer: args
    message: "Tool call arguments are missing a required field"
    mitigation:
      - "Add the missing field shown in the error message"
      - "Call describe_tools for the tool's full inputSchema"
    references:
      - kind: tool
        id: describe_tools

  - code: tdmcp.args.unknown_field
    layer: args
    message: "Tool call arguments contain an unknown field"
    mitigation:
      - "Remove or rename the field shown in the error message (camelCase)"
      - "Call describe_tools for the tool's full inputSchema"
    references:
      - kind: tool
        id: describe_tools

  - code: tdmcp.args.unknown_variant
    layer: args
    message: "Argument value is not one of the allowed variants"
    mitigation:
      - "Use one of the allowed values listed in the error message"
      - "Call describe_tools for the tool's full inputSchema"
    references:
      - kind: tool
        id: describe_tools

  - code: tdmcp.args.wrong_type
    layer: args
    message: "Argument value has the wrong JSON type"
    mitigation:
      - "Match the expected type shown in the error message"
      - "Call describe_tools for the tool's full inputSchema"
    references:
      - kind: tool
        id: describe_tools

  - code: tdmcp.args.similar_field
    layer: args
    message: "Similar argument key found (typo / near-miss)"
    mitigation:
      - "Replace the key with the suggested spelling"
    references:
      - kind: tool
        id: describe_tools

  - code: tdmcp.mcp.serialize_failed
    layer: fleet
    message: "Tool result failed to serialize (internal error)"
    mitigation:
      - "Retry the call; if it persists, inspect daemon logs (`tdmcp-daemon logs`)"
